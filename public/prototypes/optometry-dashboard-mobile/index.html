<!doctype html>
<!-- Sister file: ../optometry-dashboard/index.html — keep metric values in sync. -->
<!-- Stephens AI "Lens" v3. Rules: brand-assets/stephens-ai-design-system/CLAUDE.md
     Intrinsic 272x363 (3:4) so the flagship embed never has to upscale.
     Authored type floor here is 15px, NOT the usual 13px: on a 360px phone the embed
     scales to ~0.90, so 15 x 0.90 = 13.5px rendered. Keep 15px as the minimum in this
     file or the rendered floor breaks. Compact rendition of the 800px dashboard:
     fewer KPI rows on purpose, since 272px cannot hold 15px caps labels four-up. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Practice Intelligence — Wichita Family Vision (mobile)</title>
<meta name="viewport" content="width=272" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:          #171310;
    --ink-90:       #241E19;
    --ink-2:        #6E6258;
    --cream:        #F5F1E8;
    --cream-2:      #B3AB9E;

    --accent:       #DC6843;
    --accent-night: #FF8E76;
    --accent-line:  rgba(220,104,67,0.18);

    --sky:   linear-gradient(180deg, #F3EEE8 0%, #F7E7DA 42%, #F7DCC9 74%, #F2CFB8 100%);
    --night: radial-gradient(130% 130% at 22% -12%, #241B15 0%, #150F0B 58%, #0D0A08 100%);

    --glass:        rgba(255,255,255,0.55);
    --glass-strong: rgba(255,255,255,0.78);
    --glass-edge:   rgba(255,255,255,0.85);
    --pane-shadow:  0 14px 44px rgba(112,62,40,0.13),
                    inset 0 1px 0 rgba(255,255,255,0.95),
                    inset 0 -1px 0 rgba(23,19,16,0.04);

    --rule:      rgba(23,19,16,0.10);
    --rule-soft: rgba(23,19,16,0.06);

    --status-good:      #2E7A56;
    --status-good-tint: rgba(46,122,86,0.12);

    --sans:  'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --label: 'Schibsted Grotesk', 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F5E9DE; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: var(--sans); color: var(--ink);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }

  .stage {
    width: 272px; height: 363px; background: var(--sky);
    position: relative; overflow: hidden; color: var(--ink);
  }

  /* ---------- Scene: tint pools + drifting lenses (gradients live here only) ---------- */
  .scene { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .tint { position: absolute; border-radius: 50%; filter: blur(60px); }
  .tint.t1 { width: 200px; height: 200px; background: #DC6843; opacity: .10; top: -84px; right: -70px; }
  .tint.t2 { width: 180px; height: 180px; background: #DC6843; opacity: .09; bottom: -76px; left: -76px; }

  .lens {
    position: absolute; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.30) 14%, rgba(255,255,255,0.05) 38%, transparent 60%),
      radial-gradient(circle at 50% 88%, rgba(220,104,67,0.28) 0%, rgba(220,104,67,0.08) 34%, transparent 55%),
      radial-gradient(circle at 50% 115%, rgba(243,206,184,0.55) 0%, transparent 52%),
      radial-gradient(circle at 50% 50%, transparent 58%, rgba(255,255,255,0.16) 88%, rgba(255,255,255,0.42) 99%);
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow:
      inset -8px -11px 24px rgba(220,104,67,0.13),
      inset 6px 9px 20px rgba(255,255,255,0.38),
      0 20px 40px rgba(112,62,40,0.14);
    animation: drift var(--drift, 16s) ease-in-out infinite alternate;
  }
  .lens.far { filter: blur(4px); opacity: .6; }
  .lens.mid { filter: blur(1.5px); opacity: .85; }
  .lens.l1 { width: 50px; height: 50px; top: 186px; right: 10px; --drift: 15s; }
  .lens.l2 { width: 96px; height: 96px; bottom: -38px; left: 20%; --drift: 22s; }
  @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-12px); } }

  .layer { position: absolute; inset: 0; z-index: 1; }

  /* ---------- Top bar (glass chrome) ---------- */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 38px;
    background: rgba(255,255,255,0.62);
    backdrop-filter: blur(26px) saturate(1.6); -webkit-backdrop-filter: blur(26px) saturate(1.6);
    border-bottom: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 6px 22px rgba(112,62,40,0.08), inset 0 1px 0 rgba(255,255,255,0.95);
    display: flex; align-items: center; padding: 0 14px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .mark { width: 20px; height: 20px; display: block; flex: none; }
  .brand .word { font-weight: 500; font-size: 16px; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }

  /* ---------- Section markers: porthole + hairline (no dot-pills) ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--label); font-size: 15px; font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--accent); line-height: 1.25;
    padding: 0 14px; position: absolute; left: 0; right: 0;
  }
  .eyebrow .port {
    width: 13px; height: 13px; border-radius: 50%; flex: none;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.25) 42%, transparent 62%),
      radial-gradient(circle at 50% 86%, rgba(220,104,67,0.5) 0%, transparent 62%),
      linear-gradient(180deg, #F7E7DA 0%, #F2CFB8 100%);
    border: 1px solid rgba(255,255,255,0.92);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -1.5px 3px rgba(220,104,67,0.3), 0 2px 5px rgba(112,62,40,0.18);
  }
  .eyebrow .txt { white-space: nowrap; }
  .eyebrow .rule { flex: 1; height: 1px; background: var(--rule); min-width: 10px; }
  .s-week   { top: 46px; }
  .s-signal { top: 179px; }

  /* ---------- KPI tiles (glass pane + the one night module) ---------- */
  .kpis {
    position: absolute; top: 71px; left: 14px; right: 14px;
    display: grid; grid-template-columns: 100px 1fr; gap: 8px;
    height: 100px;
  }
  .tile {
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(1.5); -webkit-backdrop-filter: blur(30px) saturate(1.5);
    border: 1px solid var(--glass-edge); border-radius: 16px;
    box-shadow: var(--pane-shadow);
    padding: 11px 10px; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color 160ms ease, box-shadow 220ms ease;
  }
  .tile.flash {
    box-shadow: 0 14px 44px rgba(112,62,40,0.13), inset 0 1px 0 rgba(255,255,255,0.95), 0 0 0 1.5px var(--accent);
  }
  .tile.dark.flash {
    box-shadow: 0 0 24px 2px rgba(255,142,118,0.35), 0 0 0 1.5px rgba(255,142,118,0.7);
  }
  /* min-height reserves two label lines so both tiles keep their numerals aligned. */
  .tile .lbl {
    font-family: var(--label); font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--ink-2); line-height: 1.2; min-height: 2.4em;
  }
  .tile .val {
    font-weight: 500; font-size: 30px; letter-spacing: -0.03em; line-height: 1;
    margin-top: auto; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap;
  }

  /* The one night module on the page. */
  .tile.dark {
    background: var(--night); border-color: rgba(255,255,255,0.12);
    backdrop-filter: none; -webkit-backdrop-filter: none;
    box-shadow: 0 20px 48px rgba(40,20,10,0.35), inset 0 1px 0 rgba(255,255,255,0.10);
  }
  .tile.dark::before {
    content: ''; position: absolute; width: 130px; height: 130px; border-radius: 50%;
    filter: blur(44px); background: var(--accent); opacity: .22; top: -58px; right: -44px; pointer-events: none;
  }
  .tile.dark .lbl { color: var(--cream-2); position: relative; }
  .tile.dark .val { color: var(--accent-night); position: relative; }

  /* ---------- Signal ---------- */
  .signal {
    position: absolute; top: 204px; left: 14px; right: 14px; height: 126px;
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(1.5); -webkit-backdrop-filter: blur(30px) saturate(1.5);
    border: 1px solid var(--glass-edge); border-radius: 18px;
    box-shadow: var(--pane-shadow);
    padding: 13px 14px;
  }
  .signal h2 {
    margin: 0; font-weight: 500; font-size: 15px; letter-spacing: -0.018em;
    color: var(--ink-90); line-height: 1.25;
  }
  .signal .meta {
    margin-top: 6px; font-size: 15px; line-height: 1.3; color: var(--ink-2);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .bars {
    margin-top: 8px; display: flex; align-items: flex-end; gap: 7px;
    height: 28px;
  }
  .bar {
    width: 42px; height: 28px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 15px;
    transform-origin: bottom center;
    transform: scaleY(var(--fill, 0));
    transition: transform 500ms cubic-bezier(0.2,0.8,0.2,1);
  }
  .bar.soft { background: rgba(220,104,67,0.20); color: var(--ink-90); }
  .bar.hot  { background: var(--accent);         color: #fff; }
  .bar .val { opacity: 0; transition: opacity 200ms ease; font-variant-numeric: tabular-nums; }
  .bar.filled .val { opacity: 1; }

  /* ---------- Footer ---------- */
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 32px;
    border-top: 1px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.42);
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
    padding: 0 14px;
    display: flex; align-items: center; justify-content: flex-end;
    font-family: var(--label); font-size: 15px; font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--ink-2);
  }
  /* Ledger status chip — two cells, no leading dot. */
  .footer .live {
    display: inline-flex; align-items: stretch; text-transform: none; letter-spacing: normal;
    border: 1px solid var(--rule); border-radius: 8px; overflow: hidden;
    background: rgba(255,255,255,0.8);
  }
  .footer .live .kw {
    font-family: var(--label); font-size: 15px; font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--status-good); background: var(--status-good-tint);
    padding: 2px 9px; display: flex; align-items: center;
  }
  .footer .live .detail {
    font: 500 15px var(--sans); color: var(--ink-90);
    padding: 2px 10px; border-left: 1px solid var(--rule);
    display: flex; align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    .stage *, .stage *::before, .stage *::after {
      animation: none !important; transition: none !important;
    }
  }
</style>
</head>
<body>

<div class="stage" data-screen-label="Practice Intelligence Dashboard (mobile)" id="stage">

  <div class="scene" aria-hidden="true">
    <span class="tint t1"></span>
    <span class="tint t2"></span>
    <span class="lens mid l1"></span>
    <span class="lens far l2"></span>
  </div>

  <div class="layer">

  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#0D0C0B" stroke-width="18" stroke-linecap="round">
          <path d="M 143 50.5 Q 143 30.5 119 30.5 L 81 30.5 Q 57 30.5 57 54.5 Q 57 76.5 75.06 99.5"/>
          <path d="M 124.94 100.5 Q 143 123.5 143 145.5 Q 143 169.5 119 169.5 L 81 169.5 Q 57 169.5 57 149.5"/>
        </g>
        <circle cx="100" cy="100" r="11.5" fill="#DC6843"/>
      </svg>
      <span class="word">Stephens AI</span>
    </div>
  </header>

  <div class="eyebrow s-week"><span class="port"></span><span class="txt">01 · This week</span><span class="rule"></span></div>

  <section class="kpis" aria-label="This week's metrics">
    <div class="tile" id="tile-1">
      <div class="lbl">Patients</div>
      <div class="val" data-final="142">0</div>
    </div>
    <div class="tile dark" id="tile-2">
      <div class="lbl">Top opportunity</div>
      <div class="val" data-final="18.8" data-prefix="$" data-suffix="K" data-decimals="1">$0.0K</div>
    </div>
  </section>

  <div class="eyebrow s-signal"><span class="port"></span><span class="txt">02 · Signal</span><span class="rule"></span></div>

  <section class="signal" aria-label="Signal of the week">
    <h2>Tuesday no-show rate climbing 3 weeks running</h2>
    <div class="meta">Now 12% · clinic avg 4%</div>
    <div class="bars">
      <div class="bar soft" id="bar-1"><span class="val" data-final="8" data-suffix="%">0%</span></div>
      <div class="bar soft" id="bar-2"><span class="val" data-final="9" data-suffix="%">0%</span></div>
      <div class="bar hot"  id="bar-3"><span class="val" data-final="12" data-suffix="%">0%</span></div>
    </div>
  </section>

  <footer class="footer">
    <span class="live"><span class="kw">Live</span><span class="detail">04:00 sync</span></span>
  </footer>

  </div>

</div>

<script>
(() => {
  const LOOP = 9000;

  const tileEls = [1,2].map(i => document.getElementById('tile-'+i));
  const tileValEls = tileEls.map(t => t.querySelector('.val'));
  const barEls  = [1,2,3].map(i => document.getElementById('bar-'+i));
  const barValEls = barEls.map(b => b.querySelector('.val'));

  // Timeline: [time, fn]
  const timeline = [
    [400,  () => fireTile(0)],
    [1000, () => fireTile(1, true)],   // dark tile gets glow
    [2300, () => fireBar(0)],
    [2800, () => fireBar(1)],
    [3300, () => fireBar(2)],
  ];

  const tweens = [];
  const tween = (el, finalVal, dur) => {
    tweens.push({ el, from: 0, to: finalVal, start: performance.now(), dur });
  };

  const formatVal = (el, current) => {
    const decimals = parseInt(el.dataset.decimals || '0', 10);
    const prefix = el.dataset.prefix || '';
    const suffix = el.dataset.suffix || '';
    return prefix + current.toFixed(decimals) + suffix;
  };

  const fireTile = (i, glow) => {
    const tile = tileEls[i];
    tile.classList.add('flash');
    setTimeout(() => tile.classList.remove('flash'), 360);
    const valEl = tileValEls[i];
    const final = parseFloat(valEl.dataset.final);
    tween(valEl, final, 600);
  };

  const fireBar = (i) => {
    barEls[i].style.setProperty('--fill', 1);
    setTimeout(() => barEls[i].classList.add('filled'), 250);
    const valEl = barValEls[i];
    const final = parseFloat(valEl.dataset.final);
    tween(valEl, final, 400);
  };

  const resetAll = () => {
    tweens.length = 0;
    tileValEls.forEach(el => {
      const decimals = parseInt(el.dataset.decimals || '0', 10);
      const prefix = el.dataset.prefix || '';
      const suffix = el.dataset.suffix || '';
      el.textContent = prefix + (0).toFixed(decimals) + suffix;
    });
    barEls.forEach(b => { b.style.setProperty('--fill', 0); b.classList.remove('filled'); });
    barValEls.forEach(v => v.textContent = '0%');
    tileEls.forEach(t => t.classList.remove('flash'));
  };

  let loopStart = performance.now();
  const fired = new Set();

  const frame = (now) => {
    let elapsed = now - loopStart;
    if (elapsed >= LOOP) {
      loopStart = now - (elapsed % LOOP);
      elapsed = now - loopStart;
      fired.clear();
      resetAll();
    }

    for (const [t, fn] of timeline) {
      if (elapsed >= t && !fired.has(t)) {
        fired.add(t);
        fn();
      }
    }

    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      const k = Math.min(1, (now - tw.start) / tw.dur);
      const e = 1 - Math.pow(1 - k, 3);
      const v = tw.from + (tw.to - tw.from) * e;
      tw.el.textContent = formatVal(tw.el, v);
      if (k >= 1) tweens.splice(i, 1);
    }

    requestAnimationFrame(frame);
  };

  resetAll();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
