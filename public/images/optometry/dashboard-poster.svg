<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Practice Intelligence Dashboard preview">
  <!-- Stephens AI "Lens" v3 — reduced-motion fallback for the Practice Intelligence prototype. -->
  <defs>
    <style>
      .p{font-family:'Schibsted Grotesk','Inter Tight','Helvetica Neue',Arial,sans-serif;font-weight:600;letter-spacing:0.62px;text-transform:uppercase;}
      .h{font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-weight:500;letter-spacing:-0.02em;}
      .n{font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-weight:500;letter-spacing:-0.03em;}
      .b{font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-weight:400;}
      .bm{font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-weight:500;}
    </style>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3EEE8"/>
      <stop offset="42%" stop-color="#F7E7DA"/>
      <stop offset="74%" stop-color="#F7DCC9"/>
      <stop offset="100%" stop-color="#F2CFB8"/>
    </linearGradient>

    <radialGradient id="tintA">
      <stop offset="0%" stop-color="#DC6843" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#DC6843" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tintB">
      <stop offset="0%" stop-color="#DC6843" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#DC6843" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tintC">
      <stop offset="0%" stop-color="#A8988A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A8988A" stop-opacity="0"/>
    </radialGradient>

    <!-- The night module (top-opportunity tile) -->
    <radialGradient id="night" cx="22%" cy="-12%" r="130%">
      <stop offset="0%" stop-color="#241B15"/>
      <stop offset="58%" stop-color="#150F0B"/>
      <stop offset="100%" stop-color="#0D0A08"/>
    </radialGradient>
    <radialGradient id="ember">
      <stop offset="0%" stop-color="#DC6843" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#DC6843" stop-opacity="0"/>
    </radialGradient>

    <!-- Scene lens: specular catch over a refracted, ember-lit belly -->
    <radialGradient id="lensCatch" cx="30%" cy="24%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lensBelly" cx="50%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#DC6843" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#DC6843" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#DC6843" stop-opacity="0"/>
    </radialGradient>

    <!-- Porthole disc (section marker) -->
    <radialGradient id="portDisc" cx="34%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="46%" stop-color="#F7E7DA"/>
      <stop offset="100%" stop-color="#EFC3A6"/>
    </radialGradient>

    <clipPath id="chipClip"><rect x="571" y="567" width="189" height="26" rx="8"/></clipPath>
    <clipPath id="nightClip"><rect x="589" y="100" width="171" height="116" rx="18"/></clipPath>
  </defs>

  <!-- ================= Scene ================= -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="760" cy="30" r="230" fill="url(#tintA)"/>
  <circle cx="20" cy="330" r="200" fill="url(#tintB)"/>
  <circle cx="480" cy="620" r="230" fill="url(#tintC)"/>

  <g opacity="0.8">
    <circle cx="707" cy="273" r="59" fill="url(#lensCatch)" stroke="rgba(255,255,255,0.55)"/>
    <circle cx="707" cy="273" r="59" fill="url(#lensBelly)"/>
  </g>
  <g opacity="0.55">
    <circle cx="345" cy="588" r="82" fill="url(#lensCatch)" stroke="rgba(255,255,255,0.5)"/>
    <circle cx="345" cy="588" r="82" fill="url(#lensBelly)"/>
  </g>

  <!-- ================= Top bar (glass chrome) ================= -->
  <rect x="0" y="0" width="800" height="56" fill="#FFFFFF" fill-opacity="0.62"/>
  <line x1="0" y1="56" x2="800" y2="56" stroke="#FFFFFF" stroke-opacity="0.75"/>
  <line x1="0" y1="56.5" x2="800" y2="56.5" stroke="#171310" stroke-opacity="0.05"/>

  <!-- Canonical Stephens AI mark -->
  <g transform="translate(40 16) scale(0.12)">
    <g fill="none" stroke="#0D0C0B" stroke-width="18" stroke-linecap="round">
      <path d="M 143 50.5 Q 143 30.5 119 30.5 L 81 30.5 Q 57 30.5 57 54.5 Q 57 76.5 75.06 99.5"/>
      <path d="M 124.94 100.5 Q 143 123.5 143 145.5 Q 143 169.5 119 169.5 L 81 169.5 Q 57 169.5 57 149.5"/>
    </g>
    <circle cx="100" cy="100" r="11.5" fill="#DC6843"/>
  </g>
  <text x="72" y="35" class="h" font-size="17" fill="#171310">Stephens AI</text>
  <text x="170" y="35" class="p" font-size="13" fill="#6E6258">· PRACTICE INTELLIGENCE</text>
  <text x="760" y="35" text-anchor="end" class="p" font-size="13" fill="#6E6258">MON 20 APR · 07:03</text>

  <!-- ================= 01 · This week ================= -->
  <circle cx="47.5" cy="82" r="7.5" fill="url(#portDisc)" stroke="#FFFFFF" stroke-opacity="0.92"/>
  <text x="63" y="87" class="p" font-size="13" fill="#DC6843">01 · THIS WEEK</text>
  <line x1="195" y1="82" x2="760" y2="82" stroke="#171310" stroke-opacity="0.10"/>

  <g>
    <rect x="40" y="100" width="173" height="116" rx="18" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.85"/>
    <text x="56" y="126" class="p" font-size="13" fill="#6E6258">PATIENTS</text>
    <text x="56" y="168" class="n" font-size="34" fill="#171310">142</text>
    <text x="56" y="197" class="bm" font-size="13" fill="#DC6843">▲ 6% · 4-wk avg</text>
  </g>
  <g>
    <rect x="223" y="100" width="173" height="116" rx="18" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.85"/>
    <text x="239" y="126" class="p" font-size="13" fill="#6E6258">OPTICAL CONV.</text>
    <text x="239" y="168" class="n" font-size="34" fill="#171310">64%</text>
    <text x="239" y="197" class="b" font-size="13" fill="#6E6258">▼ 4 pts</text>
  </g>
  <g>
    <rect x="406" y="100" width="173" height="116" rx="18" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.85"/>
    <text x="422" y="126" class="p" font-size="13" fill="#6E6258">RECALL COMP.</text>
    <text x="422" y="168" class="n" font-size="34" fill="#171310">71%</text>
    <text x="422" y="197" class="b" font-size="13" fill="#6E6258">· In range</text>
  </g>
  <!-- The one night module on the page -->
  <g>
    <rect x="589" y="100" width="171" height="116" rx="18" fill="url(#night)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <ellipse cx="748" cy="104" rx="86" ry="72" fill="url(#ember)" clip-path="url(#nightClip)"/>
    <text x="605" y="126" class="p" font-size="13" fill="#B3AB9E">TOP OPPORTUNITY</text>
    <text x="605" y="168" class="n" font-size="34" fill="#FF8E76">$18.8K</text>
    <text x="605" y="197" class="b" font-size="13" fill="#B3AB9E">· 47 overdue patients</text>
  </g>

  <!-- ================= 02 · Signal ================= -->
  <circle cx="47.5" cy="240" r="7.5" fill="url(#portDisc)" stroke="#FFFFFF" stroke-opacity="0.92"/>
  <text x="63" y="245" class="p" font-size="13" fill="#DC6843">02 · SIGNAL</text>
  <line x1="170" y1="240" x2="760" y2="240" stroke="#171310" stroke-opacity="0.10"/>

  <g>
    <rect x="40" y="258" width="720" height="124" rx="22" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.85"/>
    <text x="60" y="290" class="h" font-size="17" fill="#241E19">Tuesday no-show rate climbing 3 weeks running</text>
    <text x="60" y="318" class="b" font-size="14" fill="#6E6258">Now 12% · clinic avg 4%</text>
    <g transform="translate(60 334)">
      <rect x="0" y="0" width="46" height="30" rx="7" fill="#DC6843" fill-opacity="0.20"/>
      <text x="23" y="20" text-anchor="middle" class="bm" font-size="13" fill="#241E19">8%</text>
      <rect x="56" y="0" width="46" height="30" rx="7" fill="#DC6843" fill-opacity="0.20"/>
      <text x="79" y="20" text-anchor="middle" class="bm" font-size="13" fill="#241E19">9%</text>
      <rect x="112" y="0" width="46" height="30" rx="7" fill="#DC6843"/>
      <text x="135" y="20" text-anchor="middle" class="bm" font-size="13" fill="#FFFFFF">12%</text>
      <text x="172" y="20" class="b" font-size="13" fill="#6E6258">· Recommend reviewing confirmations</text>
    </g>
  </g>

  <!-- ================= 03 · 12 metrics tracked ================= -->
  <circle cx="47.5" cy="406" r="7.5" fill="url(#portDisc)" stroke="#FFFFFF" stroke-opacity="0.92"/>
  <text x="63" y="411" class="p" font-size="13" fill="#DC6843">03 · 12 METRICS TRACKED</text>
  <line x1="273" y1="406" x2="760" y2="406" stroke="#171310" stroke-opacity="0.10"/>

  <rect x="40" y="424" width="720" height="112" rx="22" fill="#FFFFFF" fill-opacity="0.48" stroke="#FFFFFF" stroke-opacity="0.70"/>
  <g class="bm" font-size="13.5" fill="#241E19">
    <text x="60" y="455">Patients</text><text x="190" y="455" fill="#DC6843">New patient %</text><text x="335" y="455">No-show rate</text><text x="475" y="455">Same-day cancel</text><text x="640" y="455">Capture rate</text>
    <text x="60" y="484">Revenue / pt</text><text x="190" y="484" fill="#DC6843">CL patient %</text><text x="335" y="484">Myopia attach</text><text x="475" y="484">Recall compliance</text><text x="640" y="484">Insurance mix</text>
    <text x="60" y="513">AR days</text><text x="190" y="513" fill="#DC6843">Top 5 leaks</text>
  </g>

  <!-- ================= Footer ================= -->
  <rect x="0" y="560" width="800" height="40" fill="#FFFFFF" fill-opacity="0.42"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#FFFFFF" stroke-opacity="0.75"/>
  <text x="40" y="585" class="p" font-size="13" fill="#6E6258">STEPHENS AI · WICHITA FAMILY VISION · v2.0</text>

  <!-- Ledger status chip: Schibsted keyword on a functional tint + fact cell. No leading dot. -->
  <g>
    <rect x="571" y="567" width="189" height="26" rx="8" fill="#FFFFFF" fill-opacity="0.80"/>
    <rect x="571" y="567" width="59" height="26" fill="#2E7A56" fill-opacity="0.12" clip-path="url(#chipClip)"/>
    <rect x="571" y="567" width="189" height="26" rx="8" fill="none" stroke="#171310" stroke-opacity="0.10"/>
    <line x1="630" y1="567" x2="630" y2="593" stroke="#171310" stroke-opacity="0.10"/>
    <text x="600.5" y="584" text-anchor="middle" class="p" font-size="13" fill="#2E7A56">LIVE</text>
    <text x="643" y="584" class="bm" font-size="13.5" fill="#241E19">sync 04:00 daily</text>
  </g>
</svg>
