<!-- SHARED PART, round 6. The operations loop. Three nodes, one stat.
     The stat label keeps its scope: a bare "Admin hours a year returned" reads
     as a product wide result, and it is one practice. -->

<div class="oploop">
  <ol class="oploop-nodes">
    <li>Request filed</li>
    <li>Checked against coverage</li>
    <li>Reaches payroll</li>
  </ol>
  <div class="oploop-stat">
    <span class="oploop-num">60 to 100</span>
    <span class="oploop-lab">Admin hours a year, at the practice we built it for</span>
  </div>
</div>
