<!--
  CANONICAL Stephens AI logo — copy these verbatim into branded HTML.
  NEVER hand-draw the "S" as an SVG path. The real mark is two Q-curve strokes
  (stroke-width 18, round caps) on a 0 0 200 200 viewBox with a #DC6843 center dot.
  A guard hook (scripts/check_brand_logo.py) blocks inline brand marks that aren't this one.

  Source of truth: brand-assets/stephens-ai-design-system/assets/
    logo-mark-dark.svg   — dark stroke (#0D0C0B) for LIGHT backgrounds  (use this by default)
    logo-mark.svg        — cream stroke for DARK backgrounds
    logo-light.svg       — full horizontal lockup (mark + "STEPHENS AI") for light bg
-->

<!-- MARK on a LIGHT background. Size it with CSS width/height on .mark. -->
<svg class="mark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <g fill="none" stroke="#0D0C0B" stroke-width="18" stroke-linecap="round">
    <path d="M 143 50.5 Q 143 30.5 119 30.5 L 81 30.5 Q 57 30.5 57 54.5 Q 57 76.5 75.06 99.5"/>
    <path d="M 124.94 100.5 Q 143 123.5 143 145.5 Q 143 169.5 119 169.5 L 81 169.5 Q 57 169.5 57 149.5"/>
  </g>
  <circle cx="100" cy="100" r="11.5" fill="#DC6843"/>
</svg>

<!-- MARK on a DARK background — swap the stroke to the cream paper color. -->
<svg class="mark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <g fill="none" stroke="#F5F1E8" stroke-width="18" stroke-linecap="round">
    <path d="M 143 50.5 Q 143 30.5 119 30.5 L 81 30.5 Q 57 30.5 57 54.5 Q 57 76.5 75.06 99.5"/>
    <path d="M 124.94 100.5 Q 143 123.5 143 145.5 Q 143 169.5 119 169.5 L 81 169.5 Q 57 169.5 57 149.5"/>
  </g>
  <circle cx="100" cy="100" r="11.5" fill="#DC6843"/>
</svg>
