<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TITLE · Stephens AI</title>
<!-- SAI:FONTS -->
<!-- SAI:KIT -->
</head>
<body>

<!-- SAI:SCENE -->

<div class="sai-dock">
  <!-- SAI:LOGO -->
  <span class="word">Stephens AI</span>
  <nav><a class="on" href="#">SECTION</a></nav>
</div>

<div class="sai-page">

  <section class="sai-rise">
    <span class="sai-port"><span class="disc"></span><span class="ptext">EYEBROW</span></span>
    <h1 class="sai-display">Headline with <em>the accent phrase</em>.</h1>
    <p class="sai-lede">One paragraph of setup. <b>Bold the part that matters.</b></p>
  </section>

  <section class="sai-widget sai-pane sai-streak sai-rise">
    <span class="sai-port"><span class="disc"></span><span class="ptext">01 · SECTION</span></span>
    <h3>Section headline</h3>
    <div class="sai-w-sub">One line of setup.</div>
    <!-- widget markup from kit/SNIPPETS.md -->
  </section>

  <!-- ONE night window per page, maximum. Spend it on the highest-drama moment. -->
  <section class="sai-night sai-rise">
    <span class="sai-ember"></span>
    <span class="sai-stamp corner on-night">LABEL</span>
    <span class="sai-port on-night"><span class="disc"></span><span class="ptext">EYEBROW</span></span>
    <h3 class="sai-w-title">The moment that matters</h3>
    <div class="sai-w-sub">Setup.</div>
  </section>

  <footer class="sai-footer">
    <span class="lockup">
      <!-- SAI:LOGO -->
      <span class="word">Stephens AI</span>
    </span>
    <span class="meta">DATE</span>
  </footer>

</div>
</body>
</html>
